[platformio]
default_envs = stackchan-vibe-pet

[env:stackchan-vibe-pet]
platform = espressif32 @ 6.12.0
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -D STACKCHAN_RELEASE_BUILD=1
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D UART_SCLK_DEFAULT=UART_SCLK_APB
  -D STACKCHAN_DEVICE_CORES3=1
  -D STACKCHAN_HAS_STACKCHAN_BSP=1
  -D STACKCHAN_HAS_SERVO=1
  -D STACKCHAN_HAS_CAMERA=0
  -D STACKCHAN_HAS_BACK_TOUCH=1
  -D STACKCHAN_HAS_SCREEN_TOUCH_PETTING=0
  -D STACKCHAN_HAS_HAPTIC=0
  -D STACKCHAN_ROUND_DISPLAY=0
  -D STACKCHAN_PHONE_CAMERA_REMOTE_ENABLED=0
  -D VIBESTACKCHAN_FIRMWARE_VERSION=\"0.1.11-power1\"
lib_deps =
  https://github.com/m5stack/M5GFX/archive/7cb26b44ab31bb41a0a597196dd2c6d868869a21.zip
  https://github.com/m5stack/M5Unified/archive/b1ffcc677014ed8bd01e5a1f240736ae654bfe12.zip
  bblanchon/ArduinoJson @ 7.4.3
  h2zero/NimBLE-Arduino @ 2.5.0
  crankyoldgit/IRremoteESP8266 @ 2.9.0
  m5stack/M5Utility @ 0.3.1
  m5stack/M5HAL @ 0.1.4
  m5stack/M5UnitUnified @ 0.6.4
  m5stack/M5Unit-NFC @ 0.1.2
  https://github.com/m5stack/StackChan-BSP.git#f7ed40e6f5d9a1d08440cb926f3a0865b81882f8
