name: Build and host tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated build tools
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements-build.txt
      - name: Build and validate split images
        run: sh scripts/build.sh
      - name: Run host regression tests
        run: sh tests/run_host_tests.sh
      - name: Run Python unit tests
        run: .venv/bin/python -m unittest discover -v -s tests -p 'test_*.py'
      - name: Check published file boundary
        run: python3 scripts/audit_public.py
